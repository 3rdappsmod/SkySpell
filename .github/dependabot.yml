version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      electron:
        update-types: ["minor", "patch"]
        patterns:
          - "electron"
          - "electron-builder"
          - "electron-updater"
          - "electron-store"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
