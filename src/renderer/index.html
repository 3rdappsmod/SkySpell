<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" />
<title>SkySpell</title>
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/layout.css" />
</head>
<body class="theme-light">
<div id="app">

  <header class="topbar">
    <div class="topbar-left">
      <span class="app-title" data-i18n="appTitle">SkySpell</span>
    </div>
    <div class="topbar-right">
      <button id="btnOpen" class="btn" data-i18n="openFile">파일 열기</button>
      <button id="btnSave" class="btn" data-i18n="saveFile">저장</button>
      <button id="btnDarkMode" class="icon-btn" data-i18n-title="toggleDarkMode" title="다크 모드 전환">&#9789;</button>
      <button id="btnAbout" class="icon-btn" data-i18n-title="about" title="SkySpell 정보">?</button>
    </div>
  </header>

  <div class="body-area">

    <aside class="sidebar">
      <div class="sidebar-scroll">

        <section class="side-section">
          <h3 data-i18n="charCounterTitle">글자수 세기</h3>

          <div class="field">
            <label data-i18n="unitLabel">단위</label>
            <div class="segmented" id="unitToggle">
              <button type="button" data-value="char" class="seg-btn active" data-i18n="unitChar">글자 수</button>
              <button type="button" data-value="byte" class="seg-btn" data-i18n="unitByte">바이트 수</button>
            </div>
          </div>

          <div class="field switch-field">
            <label for="includeSpacesToggle" data-i18n="includeSpacesLabel">공백 포함</label>
            <input type="checkbox" id="includeSpacesToggle" class="switch" checked />
          </div>

          <div class="field">
            <label for="limitInput" data-i18n="limitLabel">제한</label>
            <input type="number" id="limitInput" min="0" step="10" value="1000" />
          </div>

          <div class="field">
            <div id="countDisplay" class="count-display">0/1000</div>
          </div>
        </section>

        <section class="side-section">
          <h3 data-i18n="legendTitle">표시 범례</h3>
          <div class="legend-list">
            <div class="legend-item"><span class="legend-dot spelling"></span><span data-i18n="legendSpelling">철자 오류</span></div>
            <div class="legend-item"><span class="legend-dot spacing"></span><span data-i18n="legendSpacing">띄어쓰기 오류</span></div>
            <div class="legend-item"><span class="legend-dot ambiguous"></span><span data-i18n="legendAmbiguous">모호한 표현</span></div>
            <div class="legend-item"><span class="legend-dot statistical"></span><span data-i18n="legendStatistical">통계적 교정</span></div>
          </div>
        </section>

      </div>
    </aside>

    <div class="main-area">
      <div class="split-view">
        <div class="pane">
          <div class="pane-header">
            <span data-i18n="originalPane">원본</span>
            <span id="inputCountLabel" class="count-label"></span>
          </div>
          <textarea id="inputText" aria-label="맞춤법 검사 원본" class="pane-input" data-i18n-placeholder="inputPlaceholder" placeholder="맞춤법을 검사할 문장을 입력하세요..." spellcheck="false"></textarea>
        </div>
        <div class="pane">
          <div class="pane-header">
            <span data-i18n="resultPane">교정 결과</span>
            <span id="resultCountLabel" class="count-label"></span>
          </div>
          <div id="resultView" class="pane-result">
            <span class="empty-hint" data-i18n="resultPlaceholder">맞춤법 검사 결과가 여기에 표시됩니다.</span>
          </div>
        </div>
      </div>

      <p class="privacy-note">검사할 때 입력한 글이 네이버로 전송됩니다. 글자수 계산은 기기에서 처리됩니다.</p>
      <div class="action-bar">
        <button id="btnCheck" class="btn btn-primary" data-i18n="runCheck">맞춤법 검사</button>
        <button id="btnApply" class="btn" data-i18n="applyAll" disabled>교정 적용</button>
        <button id="btnCopyResult" class="btn" disabled data-i18n="copyResult">결과 복사</button>
        <button id="btnClear" class="btn" data-i18n="clear">지우기</button>
      </div>

      <div id="statusLine" class="status-line" role="status" aria-live="polite"></div>
    </div>

  </div>
</div>

<div id="aboutModal" class="modal hidden">
  <div class="modal-backdrop" data-close="about"></div>
  <div class="modal-box">
    <h2 data-i18n="about">SkySpell 정보</h2>
    <p class="about-version"><span data-i18n="version">버전</span> <span id="appVersion">0.1.0</span></p>
    <p class="about-desc" data-i18n="aboutDescription">하늘색 테마의 크로스플랫폼 한국어 맞춤법 검사 · 글자수 세기 프로그램입니다.</p>
    <p class="about-disclaimer" data-i18n="aboutDisclaimer">네이버 맞춤법 검사기의 비공식 엔드포인트를 사용합니다.</p>
    <p class="about-libs" data-i18n="aboutLibs">사용 기술: Electron</p>
    <div class="modal-actions">
      <button class="btn" data-close="about" data-i18n="close">닫기</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/charCounter.js"></script>
<script src="js/spellParser.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
